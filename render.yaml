# =============================================================================
# Render Blueprint Specification - Magicpin Vera Bot (Root Repository)
# =============================================================================
# CRITICAL ARCHITECTURAL REQUIREMENT:
# ContextStore and ConversationStore in app/store.py are in-memory and process-local.
# The deployment MUST run as a single instance (numInstances: 1) with autoscaling
# disabled. Multiple instances or multiple uvicorn workers will silently fragment
# state across separate memory spaces.
# =============================================================================

services:
  - type: web
    name: magicpin-vera-bot
    runtime: docker
    dockerfilePath: ./magicpin-bot/Dockerfile
    dockerContext: ./magicpin-bot
    plan: starter
    region: oregon
    
    # CRITICAL: Enforce single instance (no autoscaling)
    numInstances: 1

    # Native health check integration
    healthCheckPath: /v1/healthz

    # Web service environment variables
    envVars:
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: INFO
      - key: APP_NAME
        value: "Magicpin Vera Bot"
      - key: APP_VERSION
        value: "1.0.0"
      - key: TEAM_NAME
        value: "Team Vera"
      - key: TEAM_MEMBERS
        value: '["Yashdeep", "Vera Team"]'
      - key: MODEL
        value: "gpt-4o"
      - key: APPROACH
        value: "deterministic trigger ranking + grounded LLM composition + output validation gate"
      - key: CONTACT_EMAIL
        value: "yashdeep.magicpin@gmail.com"
      - key: LLM_TIMEOUT_SECONDS
        value: "8.0"
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
